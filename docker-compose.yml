services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY e SUPABASE_STORAGE_BUCKET
    # são carregadas só pelo backend a partir deste arquivo ignorado pelo Git.
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app:ro

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
